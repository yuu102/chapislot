<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e0e0f"><title>チャピスロ Phase3</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<header><p class="eyebrow">CHAPISURO · PHASE 3</p><h1>チャピスロ</h1><p>座る前のデータで候補台を比較</p></header><main>
<section class="top-panel"><div><small>今日のホール</small><strong id="hall-display">未設定</strong></div><button id="hall-edit" type="button">設定</button><form id="hall-form" class="hidden"><input id="hall-name" maxlength="60" placeholder="例：123横浜西口店"><button>保存</button><button id="hall-cancel" type="button">取消</button></form></section>
<section class="mode-panel"><span>評価モード</span><div><button class="mode active" data-mode="depth" type="button">ハマり台重視</button><button class="mode" data-mode="behavior" type="button">挙動重視</button></div><small id="mode-description">ゲーム数・前日最終・大きな凹みを重視</small></section>
<p class="notice">グラフや過去の出玉は今後の当たりを保証するものではありません。候補台を比較するための参考情報として使用してください。</p>
<section aria-labelledby="ranking-title"><div class="heading"><div><p class="kicker">着席候補</p><h2 id="ranking-title">候補台ランキング <span id="count">0台</span></h2></div><button id="reset-all" class="danger hidden" type="button">候補をリセット</button></div>
<div id="top-compare" class="compare hidden"><h3>上位3台を比較</h3><div id="compare-list"></div></div>
<div class="toolbar"><select id="filter"><option value="all">すべての機種</option><option>戦国乙女5</option><option>甲鉄城のカバネリ</option><option>モンキーターンV</option></select><select id="sort"><option value="score">おすすめ順</option><option value="games">ゲーム数順</option><option value="created">登録順</option></select></div>
<div id="empty" class="empty">比較する候補台がありません<br><small>下のフォームから登録してください。</small></div><div id="list" class="cards"></div></section>
<section class="panel" aria-labelledby="form-title"><div class="heading"><div><p class="kicker" id="form-mode">新規候補</p><h2 id="form-title">候補台を追加</h2></div><button id="cancel-edit" class="link hidden" type="button">編集をやめる</button></div>
<form id="candidate-form" novalidate>
<div class="field full"><label for="machine">機種名 <b>必須</b></label><input id="machine" name="machine" list="machines" maxlength="50" required><datalist id="machines"><option value="戦国乙女5"><option value="甲鉄城のカバネリ"><option value="モンキーターンV"></datalist></div>
<div class="field"><label for="machineNumber">台番号 <b>必須</b></label><input id="machineNumber" name="machineNumber" inputmode="numeric" maxlength="12" required></div><div class="field"><label for="currentGames">現在ゲーム数</label><div class="unit"><input id="currentGames" name="currentGames" type="number" min="0" inputmode="numeric"><span>G</span></div><div class="quick"><button data-target="currentGames" data-add="50" type="button">+50</button><button data-target="currentGames" data-add="100" type="button">+100</button><button data-target="currentGames" data-add="500" type="button">+500</button></div></div>
<div class="field"><label for="totalGames">当日総回転数</label><div class="unit"><input id="totalGames" name="totalGames" type="number" min="0" inputmode="numeric"><span>G</span></div></div><div class="field"><label for="firstHits">初当たり回数</label><div class="unit"><input id="firstHits" name="firstHits" type="number" min="0" inputmode="numeric"><span>回</span></div></div><div class="field"><label for="bonusCount">ボーナス・AT・ART回数</label><div class="unit"><input id="bonusCount" name="bonusCount" type="number" min="0" inputmode="numeric"><span>回</span></div></div><div class="field"><label for="previousGames">前日最終ゲーム数</label><div class="unit"><input id="previousGames" name="previousGames" type="number" min="0" inputmode="numeric"><span>G</span></div></div><div class="field"><label for="maxCoins">最大持玉</label><div class="unit"><input id="maxCoins" name="maxCoins" type="number" min="0" inputmode="numeric"><span>枚</span></div></div>
<div class="divider full">差枚・スランプグラフ</div>
<div class="field full"><label for="currentDiff">現在差枚</label><div class="unit"><input id="currentDiff" name="currentDiff" type="number" inputmode="numeric"><span>枚</span></div><div class="quick four"><button data-target="currentDiff" data-add="-1000" type="button">-1,000</button><button data-target="currentDiff" data-add="-500" type="button">-500</button><button data-target="currentDiff" data-add="500" type="button">+500</button><button data-target="currentDiff" data-add="1000" type="button">+1,000</button></div></div>
<div class="field"><label for="highDiff">最高差枚</label><div class="unit"><input id="highDiff" name="highDiff" type="number" inputmode="numeric"><span>枚</span></div><div class="quick"><button data-target="highDiff" data-add="500" type="button">+500</button><button data-target="highDiff" data-add="1000" type="button">+1,000</button></div></div><div class="field"><label for="lowDiff">最低差枚</label><div class="unit"><input id="lowDiff" name="lowDiff" type="number" inputmode="numeric"><span>枚</span></div><div class="quick"><button data-target="lowDiff" data-add="-500" type="button">-500</button><button data-target="lowDiff" data-add="-1000" type="button">-1,000</button></div></div>
<div class="field full"><label for="graphState">グラフ状態</label><select id="graphState" name="graphState"><option value="">未選択</option><option>右肩上がり</option><option>緩やかに上昇</option><option>上下しながら上昇</option><option>横ばい</option><option>上下に荒い</option><option>緩やかに下降</option><option>右肩下がり</option><option>大きく凹んでいる</option><option>V字回復</option><option>上昇後に失速</option><option>不明</option></select></div><div class="field full"><label for="recentFlow">グラフの直近の流れ</label><select id="recentFlow" name="recentFlow"><option value="">未選択</option><option>上昇中</option><option>横ばい</option><option>下降中</option><option>急上昇後</option><option>急下降後</option><option>底から回復中</option><option>高い位置で停滞</option><option>低い位置で停滞</option><option>不明</option></select></div><div class="field full"><label for="previousGraph">前日グラフ・過去数日データ</label><textarea id="previousGraph" name="previousGraph" maxlength="300" rows="2" placeholder="例：前日右肩下がり、3日間マイナス"></textarea></div><div class="field full"><label for="note">メモ</label><textarea id="note" name="note" maxlength="500" rows="3"></textarea></div><p id="error" class="error full"></p><button id="save" class="primary full">候補に追加</button><button id="reset-machine" class="secondary full" type="button">機種名もリセット</button></form></section>
</main><div id="toast" class="toast" role="status"></div></body></html>
